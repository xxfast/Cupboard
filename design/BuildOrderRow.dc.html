<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display: flex; align-items: center; gap: {{ gap }}; padding: {{ pad }}; border-radius: {{ radius }}; background: {{ bg }}; border: {{ border }}; border-left: {{ borderLeft }}; box-sizing: border-box; cursor: pointer;" style-hover="filter: brightness(1.08);">
  <div style="width: {{ badgeSize }}; height: {{ badgeSize }}; border-radius: 50%; background: {{ badgeBg }}; color: {{ badgeText }}; font-size: {{ badgeFont }}; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{ n }}</div>
  <div style="flex: 1; min-width: 0;">
    <div style="font-size: {{ titleFont }}; color: {{ titleColor }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ label }}</div>
    <div style="font-size: {{ metaFont }}; color: {{ metaColor }};">{{ meta }}</div>
  </div>
  <div style="color: {{ metaColor }}; font-size: 11.5px; cursor: grab;">⠿</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 282, &quot;height&quot;: 60}, &quot;os&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;macOS&quot;, &quot;Windows&quot;, &quot;Linux&quot;], &quot;default&quot;: &quot;macOS&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;theme&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot;}, &quot;n&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 1, &quot;tsType&quot;: &quot;number&quot;}, &quot;label&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Title — Lorem ipsum dolor&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;meta&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Fade Up · 0.4s&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;active&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const t = this.props.theme || {};
    const os = this.props.os || 'macOS';
    const active = !!this.props.active;
    const mac = os === 'macOS', win = os === 'Windows', linux = os === 'Linux';

    const geo = mac
      ? { gap: '9px', pad: '7px 9px', radius: '6px', badgeSize: '17px', badgeFont: '10.5px', titleFont: '12px', metaFont: '10.5px' }
      : win
      ? { gap: '10px', pad: '8px 10px', radius: '4px', badgeSize: '18px', badgeFont: '11px', titleFont: '12.5px', metaFont: '11px' }
      : { gap: '10px', pad: '10px 12px', radius: '12px', badgeSize: '20px', badgeFont: '11px', titleFont: '13px', metaFont: '11px' };

    let bg = t.rowBg, border = 'none', borderLeft = 'none', titleColor = t.text;
    if (active) {
      if (mac) { bg = 'rgba(127,82,255,0.22)'; border = '1px solid #7F52FF'; }
      else if (win) { bg = t.rowBg; borderLeft = '3px solid ' + t.accent; }
      else { bg = t.tonal; titleColor = t.tonalText; }
    } else if (win) {
      borderLeft = '3px solid transparent';
    }

    return Object.assign(geo, {
      n: this.props.n ?? 1,
      label: this.props.label ?? 'Untitled',
      meta: this.props.meta ?? '',
      bg, border, borderLeft, titleColor,
      badgeBg: active ? t.accent : t.badgeOff,
      badgeText: active ? t.accentText : t.badgeOffText,
      metaColor: linux ? t.subtle : (win ? t.subtle2 : t.subtle),
    });
  }
}
</script>
</body>
</html>
