<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 100%; height: 100%; display: flex; flex-direction: column; min-width: 0; background: {{ theme.well }}; position: relative;">
  <div style="flex: 1; box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; overflow: hidden; padding: {{ canvasPad }};">
    <sc-if value="{{ showCanvasNote }}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; background: rgba(127,82,255,0.12); border: 1px solid rgba(127,82,255,0.35); color: #9579e8; font-size: 10.5px; font-family: 'IBM Plex Mono', monospace;">◆ compose canvas — identical on all platforms</div>
    </sc-if>
    <dc-import name="Slide" width="{{ slideW }}" interactive="{{ true }}" show-guides="{{ showGuides }}" show-badges="{{ showBadges }}" shadow="0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px #33363d" hint-size="1114px,626px"></dc-import>
  </div>


  <sc-if value="{{ showStatus }}" hint-placeholder-val="{{ true }}">
  <div style="height: 30px; flex-shrink: 0; display: flex; align-items: center; padding: 0 16px; gap: 16px; background: {{ theme.panel }}; border-top: 1px solid {{ theme.border }}; font-size: 11.5px; color: {{ theme.faint }}; font-family: 'IBM Plex Mono', monospace;">
    <div>slide {{ slideNum }} / {{ slideTotal }}</div>
    <div>944 × 531 @ 1x</div>
    <div>{{ theme.uiLabel }}</div>
    <div style="flex: 1;"></div>
    <div style="color: #4caf7d;">● synced</div>
  </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1060, &quot;height&quot;: 700}, &quot;theme&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot;}, &quot;showGuides&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;showNotes&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;showBadges&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;slideNum&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 1, &quot;tsType&quot;: &quot;number&quot;}, &quot;slideTotal&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 7, &quot;tsType&quot;: &quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const t = this.props.theme || {};
    const isMac = (this.props.os || 'macOS') === 'macOS';
    const notes = this.props.showNotes ?? true;
    const pad = (this.props.inspectorOpen ?? true) ? '282px' : '0px';
    const leftPad = (this.props.sidebarOpen ?? true) ? '212px' : '0px';
    const zoom = this.props.zoom ?? (isMac ? 84 : 55);
    const boxScale = (zoom / 100) * (1920 / 944);
    return {
      theme: t,
      showGuides: this.props.showGuides ?? true,
      showNotes: this.props.showNotes ?? true,
      badgeDisplay: (this.props.showBadges ?? false) ? 'flex' : 'none',
      slideNum: this.props.slideNum ?? 1,
      slideTotal: this.props.slideTotal ?? 1,
      slideW: Math.round((zoom / 100) * 1920),
      inspectorPad: pad,
      navPad: leftPad,
      notesPadLeft: (this.props.sidebarOpen ?? true) ? '256px' : '48px',
      notesPadRight: (this.props.inspectorOpen ?? true) ? '314px' : '48px',
      macNotesSolid: t.dark ? '#26262c' : '#ffffff',
      canvasPad: isMac ? ('52px ' + pad + ' ' + (notes ? 122 : 0) + 'px ' + leftPad) : '28px',
      showCanvasNote: !isMac,
      slideOrigin: isMac ? 'center' : 'top left',
      slideScale: 'scale(' + boxScale.toFixed(4) + ')',
      showNotesChrome: !isMac && notes,
      showStatus: !isMac,
      showMacNotes: isMac && notes,
      macNotesBg: t.dark ? 'linear-gradient(rgba(44,44,50,0.56), rgba(32,32,38,0.48))' : 'linear-gradient(rgba(252,251,249,0.64), rgba(244,243,241,0.54))',
      macBlur: 'blur(34px) saturate(190%)',
      macEdge: t.dark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.10)',
      macTopLight: t.dark ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.75)',
    };
  }
}
</script>
</body>
</html>
