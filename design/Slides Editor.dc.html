<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc><helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Ubuntu:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./platform-theme.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #101116; }
  a { color: #a98fff; text-decoration: none; }
  a:hover { color: #c3b1ff; }
  ::selection { background: rgba(127,82,255,0.35); }
</style>
</helmet>
<div data-screen-label="Slides Editor (native controls)" style="width: 1680px; height: 1050px; box-sizing: border-box; padding: 30px; background: radial-gradient(1200px 800px at 30% 20%, #1c1e2b 0%, #101116 60%), #101116; display: flex; align-items: stretch; justify-content: center; font-family: {{ t.font }};">
  <div style="flex: 1; display: flex; flex-direction: column; background: {{ t.chrome }}; border-radius: {{ t.winR }}; border: 1px solid {{ t.border }}; box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4); overflow: hidden;">

    <sc-if value="{{ isMac }}" hint-placeholder-val="{{ true }}">
      <div ref="{{ shellRef }}" style="flex: 1; min-height: 0; position: relative; background: {{ t.well }}; overflow: hidden;">
        <div style="position: absolute; inset: 0; z-index: 0; display: grid; overflow: hidden;">
          <dc-import name="SlideCanvas" os="{{ os }}" zoom="{{ zoom }}" inspector-open="{{ inspectorOpen }}" sidebar-open="{{ sidebarOpen }}" theme="{{ t }}" show-guides="{{ showGuides }}" show-notes="{{ showNotes }}" show-badges="{{ showBadges }}" slide-num="{{ slideNum }}" slide-total="{{ slideTotal }}" hint-size="100%,100%"></dc-import>
        </div>
        <sc-if value="{{ showNotes }}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 122px; z-index: 1; display: grid;">
          <dc-import name="SpeakerNotes" os="{{ os }}" theme="{{ t }}" sidebar-open="{{ sidebarOpen }}" inspector-open="{{ inspectorOpen }}" hint-size="100%,122px"></dc-import>
        </div>
        </sc-if>
        <sc-if value="{{ sidebarOpen }}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; left: 10px; top: 8px; bottom: 10px; width: 212px; z-index: 2; display: grid; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 26px rgba(0,0,0,0.18), inset 0 0 0 1px {{ t.border }};">
          <dc-import name="SlideNavigator" os="{{ os }}" theme="{{ t }}" slides="{{ deck }}" selected="{{ selected }}" collapsed="{{ collapsed }}" on-select="{{ selectSlide }}" on-toggle="{{ toggleSection }}" on-toggle-sidebar="{{ toggleSidebar }}" hint-size="212px,100%"></dc-import>
        </div>
        </sc-if>
        <sc-if value="{{ sidebarClosed }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; left: 18px; top: 0; height: 52px; z-index: 4; display: flex; align-items: center; gap: 14px;">
          <div style="display: flex; gap: 8px;">
            <div style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57;"></div>
            <div style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e;"></div>
            <div style="width: 12px; height: 12px; border-radius: 50%; background: #28c840;"></div>
          </div>
          <div onClick="{{ toggleSidebar }}" title="Show sidebar" style="width: 36px; height: 30px; border-radius: 15px; background: {{ t.ctrl }}; box-shadow: 0 0.5px 1.5px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; cursor: pointer; color: {{ t.icon }};" style-hover="background: {{ t.ctrlHov }};">
            <svg width="17" height="15" viewBox="0 0 17 15" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="0.7" y="0.7" width="15.6" height="13.6" rx="2.6"></rect><path d="M6.1 0.7 V14.3"></path></svg>
          </div>
        </div>
        </sc-if>
        <sc-if value="{{ inspectorOpen }}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 282px; z-index: 2; display: grid;">
          <dc-import name="Inspector" os="{{ os }}" theme="{{ t }}" tab="{{ tab }}" on-format="{{ setFormat }}" on-animate="{{ setAnimate }}" on-document="{{ setDocument }}" hint-size="282px,100%"></dc-import>
        </div>
        </sc-if>
        <div style="position: absolute; left: {{ toolbarLeft }}; right: 0; top: 0; height: 52px; z-index: 3; display: grid;">
          <dc-import name="EditorToolbar" os="{{ os }}" theme="{{ t }}" tab="{{ toolbarTab }}" inspector-open="{{ inspectorOpen }}" on-format="{{ setFormat }}" on-animate="{{ setAnimate }}" on-document="{{ setDocument }}" zoom-label="{{ zoomLabel }}" zoom-open="{{ zoomOpen }}" zoom-options="{{ zoomOptions }}" on-zoom-toggle="{{ onZoomToggle }}" hint-size="100%,52px"></dc-import>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isOther }}" hint-placeholder-val="{{ false }}">
      <div style="flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden;">
        <dc-import name="EditorToolbar" os="{{ os }}" theme="{{ t }}" tab="{{ toolbarTab }}" inspector-open="{{ inspectorOpen }}" on-format="{{ setFormat }}" on-animate="{{ setAnimate }}" zoom-label="{{ zoomLabel }}" zoom-open="{{ zoomOpen }}" zoom-options="{{ zoomOptions }}" on-zoom-toggle="{{ onZoomToggle }}" hint-size="100%,96px"></dc-import>
        <div ref="{{ shellRef }}" style="min-height: 0; display: grid; grid-template-columns: {{ otherCols }}; overflow: hidden;">
          <dc-import name="SlideNavigator" os="{{ os }}" theme="{{ t }}" slides="{{ deck }}" selected="{{ selected }}" collapsed="{{ collapsed }}" on-select="{{ selectSlide }}" on-toggle="{{ toggleSection }}" hint-size="224px,100%"></dc-import>
          <div style="min-width: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden;">
            <dc-import name="SlideCanvas" os="{{ os }}" zoom="{{ zoom }}" inspector-open="{{ inspectorOpen }}" sidebar-open="{{ sidebarOpen }}" theme="{{ t }}" show-guides="{{ showGuides }}" show-notes="{{ showNotes }}" show-badges="{{ showBadges }}" slide-num="{{ slideNum }}" slide-total="{{ slideTotal }}" hint-size="100%,100%"></dc-import>
            <sc-if value="{{ showNotes }}" hint-placeholder-val="{{ true }}">
              <dc-import name="SpeakerNotes" os="{{ os }}" theme="{{ t }}" hint-size="100%,90px"></dc-import>
            </sc-if>
          </div>
          <sc-if value="{{ inspectorOpen }}" hint-placeholder-val="{{ true }}">
            <dc-import name="Inspector" os="{{ os }}" theme="{{ t }}" tab="{{ tab }}" on-format="{{ setFormat }}" on-animate="{{ setAnimate }}" on-document="{{ setDocument }}" hint-size="282px,100%"></dc-import>
          </sc-if>
        </div>
      </div>
    </sc-if>
  </div>
</div></x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1680, &quot;height&quot;: 1050}, &quot;os&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;macOS&quot;, &quot;Windows&quot;, &quot;Linux&quot;], &quot;default&quot;: &quot;macOS&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Platform&quot;}, &quot;theme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Dark&quot;, &quot;Light&quot;], &quot;default&quot;: &quot;Dark&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Platform&quot;}, &quot;showNotes&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;View&quot;}, &quot;showGuides&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;View&quot;}}">
class Component extends DCLogic {
  _shell = React.createRef();
  state = { tab: 'format', selected: 3, collapsed: {}, zoom: 'fit', zoomOpen: false };

  componentDidMount() {
    // platform-theme.js loads from <helmet>; re-render once it lands.
    if (!window.SlidesTheme) {
      this._poll = setInterval(() => {
        if (window.SlidesTheme) { clearInterval(this._poll); this.forceUpdate(); }
      }, 25);
      setTimeout(() => clearInterval(this._poll), 4000);
    }
    // Fit must be measured against the mocked editor window, not the browser viewport.
    this._measure = () => {
      const el = this._shell.current;
      if (!el || !el.clientWidth) return;
      if (el.clientWidth !== this.state.shellW || el.clientHeight !== this.state.shellH) {
        this.setState({ shellW: el.clientWidth, shellH: el.clientHeight });
      }
    };
    this._ro = new ResizeObserver(this._measure);
    if (this._shell.current) this._ro.observe(this._shell.current);
    this._measure();
  }
  componentDidUpdate() {
    if (this._ro && this._shell.current && this._observed !== this._shell.current) {
      this._ro.disconnect();
      this._ro.observe(this._shell.current);
      this._observed = this._shell.current;
      this._measure();
    }
  }
  componentWillUnmount() { clearInterval(this._poll); if (this._ro) this._ro.disconnect(); }

  pickTab(name) {
    const canClose = (this.props.os ?? 'macOS') === 'macOS';
    this.setState(s => (canClose && s.tab === name && s.inspectorOpen !== false)
      ? { inspectorOpen: false }
      : { tab: name, inspectorOpen: true });
  }
  renderVals() {
    const os = this.props.os ?? 'macOS';
    const S = window.SlidesTheme;
    const t = S ? S.resolve(os, this.props.theme ?? 'Dark') : {};
    const deck = S ? S.deck : [];
    const isFormat = this.state.tab === 'format';
    // Only macOS can collapse the inspector — Windows/Linux tabs have no close affordance.
    const open = os !== 'macOS' || this.state.inspectorOpen !== false;
    const isMac = os === 'macOS';
    // Slides are 1920x1080 natively; zoom is a percentage of that, like Keynote.
    // "Fit" fills the space the canvas layer actually occupies on each platform.
    // Fit is measured against the space the slide can actually occupy: on macOS the
    // gap between the two floating panels (1124px of 1920 native = 58%), not the
    // full window — a Fit that tucks content under the panels hides the document.
    // Fit is measured, not guessed: the slide may only use the gap left between the
    // navigator and the inspector, so closing the inspector hands that 282px back.
    const shellW = this.state.shellW || 1618;
    const sidebar = os !== 'macOS' || this.state.sidebarOpen !== false;
    const gutters = isMac ? ((sidebar ? 212 : 0) + (open ? 282 : 0)) : (224 + 56 + (open ? 282 : 0));
    // Fit is bounded by BOTH axes: width by the panel gutters, height by the floating
    // toolbar strip and the notes bar.
    const shellH = this.state.shellH || 988;
    const vGutters = isMac ? (52 + ((this.props.showNotes ?? true) ? 122 : 0)) : 56;
    const fitW = ((shellW - gutters) / 1920) * 100;
    const fitH = ((shellH - vGutters) / 1080) * 100;
    const fitZoom = Math.max(20, Math.min(200, Math.floor(Math.min(fitW, fitH))));
    const zoomState = this.state.zoom ?? 'fit';
    const zoomValue = zoomState === 'fit' ? fitZoom : zoomState;
    const zoomChoices = [['Fit in window', 'fit'], ['25%', 25], ['50%', 50], ['75%', 75], ['100%', 100], ['125%', 125], ['150%', 150], ['200%', 200]];

    return {
      t, os, deck, isMac, isOther: !isMac, shellRef: this._shell,
      zoom: zoomValue,
      zoomLabel: zoomValue + '%',
      zoomOpen: this.state.zoomOpen,
      onZoomToggle: () => this.setState(s => ({ zoomOpen: !s.zoomOpen })),
      zoomOptions: zoomChoices.map(([label, value]) => ({
        label,
        check: zoomState === value ? '✓' : '',
        onPick: () => this.setState({ zoom: value, zoomOpen: false }),
      })),
      tab: this.state.tab,
      selected: this.state.selected,
      collapsed: this.state.collapsed,
      showNotes: this.props.showNotes ?? true,
      showGuides: this.props.showGuides ?? true,
      showBadges: open && this.state.tab === 'animate',
      slideNum: this.state.selected + 1,
      slideTotal: deck.length,
      inspectorOpen: open,
      sidebarOpen: sidebar, sidebarClosed: isMac && !sidebar,
      toolbarLeft: sidebar ? '232px' : '112px',
      toggleSidebar: () => this.setState(s => ({ sidebarOpen: s.sidebarOpen === false })),
      toolbarTab: open ? this.state.tab : 'none',
      otherCols: open ? '224px minmax(0, 1fr) 282px' : '224px minmax(0, 1fr)',
      setFormat: () => this.pickTab('format'),
      setAnimate: () => this.pickTab('animate'),
      setDocument: () => this.pickTab('document'),
      selectSlide: (i) => this.setState({ selected: i }),
      toggleSection: (i) => this.setState(s => {
        const willCollapse = !s.collapsed[i];
        const next = { collapsed: Object.assign({}, s.collapsed, { [i]: willCollapse }) };
        // Keynote: collapsing a group whose descendant is selected moves the
        // selection up to the parent, never leaving it on a hidden row.
        if (willCollapse) {
          const depth = (j) => deck[j] ? (deck[j].depth ?? 0) : 0;
          let last = i;
          while (last + 1 < deck.length && depth(last + 1) > depth(i)) last++;
          if (s.selected > i && s.selected <= last) next.selected = i;
        }
        return next;
      }),
    };
  }
}
</script>
</body>
</html>
