<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: {{ panelBg }}; backdrop-filter: {{ panelBlur }}; border-right: 1px solid {{ panelEdge }}; box-shadow: {{ panelInner }};">

  <sc-if value="{{ isMac }}" hint-placeholder-val="{{ true }}">
    <div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; padding: 0 14px 0 18px; gap: 10px;">
      <div style="display: flex; gap: 8px;">
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57;"></div>
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e;"></div>
        <div style="width: 12px; height: 12px; border-radius: 50%; background: #28c840;"></div>
      </div>
      <div style="flex: 1;"></div>
      <div onClick="{{ onToggleSidebar }}" title="Hide sidebar" style="width: 26px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: {{ theme.icon }}; cursor: pointer;" style-hover="background: {{ theme.hov }};">
        <svg width="17" height="15" viewBox="0 0 17 15" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="0.7" y="0.7" width="15.6" height="13.6" rx="2.6"></rect><path d="M6.1 0.7 V14.3"></path></svg>
      </div>
    </div>
    <div style="flex: 1; overflow-y: auto; padding: 2px 8px 16px 8px; display: flex; flex-direction: column; gap: 2px;">
      <sc-for list="{{ rows }}" as="s" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; align-items: flex-start;">
          <div onClick="{{ s.onClick }}" style="display: flex; align-items: flex-end; gap: 5px; cursor: pointer; padding: 5px 6px; border-radius: 10px; background: {{ s.capsule }}; box-shadow: {{ s.capsuleEdge }}; margin-left: {{ s.indentPx }};" style-hover="background: {{ theme.hov }};">
            <div style="width: 12px; flex-shrink: 0; font-size: 11px; line-height: 1; color: {{ theme.faint }}; text-align: right; padding-bottom: 2px;">{{ s.n }}</div>
            <dc-import name="Slide" width="{{ thumbW }}" radius="4px" shadow="{{ s.thumbShadow }}" hint-size="150px,84px"></dc-import>
          </div>
          <sc-if value="{{ s.hasKids }}" hint-placeholder-val="{{ false }}">
            <div onClick="{{ s.onToggle }}" style="height: 22px; align-self: stretch; display: flex; align-items: center; justify-content: center; color: {{ theme.dim }}; font-size: 11px; line-height: 1; cursor: pointer; border-radius: 6px;" style-hover="background: {{ theme.hov2 }};">{{ s.arrow }}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isOther }}" hint-placeholder-val="{{ false }}">
    <div style="flex: 1; overflow-y: auto; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 6px;">
      <sc-for list="{{ rows }}" as="s" hint-placeholder-count="7">
        <div onClick="{{ s.onClick }}" style="display: flex; align-items: flex-start; gap: 4px; cursor: pointer; padding: 5px 6px 5px 0; border-radius: 9px; background: {{ s.capsule }};" style-hover="background: {{ theme.rowBg }};">
          <div onClick="{{ s.onToggle }}" style="width: 14px; height: 14px; flex-shrink: 0; margin-top: 3px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: {{ theme.dim }}; border-radius: 3px;" style-hover="background: {{ theme.hov }};">{{ s.arrow }}</div>
          <div style="flex: 1; min-width: 0; display: flex; gap: 6px; margin-left: {{ s.indentPx }};">
            <div style="width: 14px; flex-shrink: 0; font-size: 11px; color: {{ theme.faint }}; text-align: right; padding-top: 2px; font-family: 'IBM Plex Mono', monospace;">{{ s.n }}</div>
            <div style="border: 2px solid {{ s.ring }}; border-radius: {{ theme.thumbR }}; line-height: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.3);">
              <dc-import name="Slide" width="{{ thumbW }}" radius="{{ theme.thumbR }}" hint-size="136px,77px"></dc-import>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 224, &quot;height&quot;: 620}, &quot;os&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;macOS&quot;, &quot;Windows&quot;, &quot;Linux&quot;], &quot;default&quot;: &quot;macOS&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;theme&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot;}, &quot;slides&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;Array&lt;{title: string, depth?: number}&gt;&quot;}, &quot;selected&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 0, &quot;tsType&quot;: &quot;number&quot;}, &quot;collapsed&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;Record&lt;number, boolean&gt;&quot;}, &quot;onSelect&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(i: number) =&gt; void&quot;}, &quot;onToggle&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;(i: number) =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const t = this.props.theme || {};
    const isMac = (this.props.os || 'macOS') === 'macOS';
    const defs = this.props.slides || [];
    const collapsed = this.props.collapsed || {};
    const selected = this.props.selected ?? 0;
    const onSelect = this.props.onSelect;
    const onToggle = this.props.onToggle;

    // Keynote model: every row is a real slide. A slide that has deeper slides
    // directly beneath it gets a disclosure chevron in the leading gutter;
    // slides without children leave that gutter empty. Numbering is absolute,
    // so collapsing a group never renumbers the slides after it.
    const parentOf = (i) => {
      for (let p = i - 1; p >= 0; p--) {
        if ((defs[p].depth ?? 0) < (defs[i].depth ?? 0)) return p;
      }
      return -1;
    };
    const hasChildren = (i) => {
      const next = defs[i + 1];
      return !!next && (next.depth ?? 0) > (defs[i].depth ?? 0);
    };

    // macOS 26 (glass Keynote): selection is a translucent capsule behind the
    // whole row — chevron gutter and number included — with a faint top-edge
    // highlight. The thumbnail itself takes no accent ring; it keeps the same
    // hairline edge selected or not, so only the capsule marks selection.
    const macCapsule = t.dark ? 'rgba(255,255,255,0.17)' : 'rgba(255,255,255,0.68)';
    const macCapsuleEdge = t.dark
      ? 'inset 0 1px 0 rgba(255,255,255,0.30), inset 0 0 0 1px rgba(255,255,255,0.12), 0 2px 6px rgba(0,0,0,0.28)'
      : 'inset 0 1px 0 rgba(255,255,255,0.95), inset 0 0 0 1px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.13)';
    const macIdle = t.dark
      ? 'inset 0 0 0 1px rgba(255,255,255,0.16)'
      : 'inset 0 0 0 1px rgba(0,0,0,0.14)';

    const rows = [];
    defs.forEach((d, i) => {
      const depth = d.depth ?? 0;
      if (depth > 0) {
        const p = parentOf(i);
        if (p >= 0 && collapsed[p]) return;
      }
      const on = i === selected;
      rows.push({
        n: i + 1,
        title: d.title,
        hasKids: hasChildren(i),
        arrow: collapsed[i] ? '›' : '⌄',
        indentPx: (depth * (isMac ? 16 : 18)) + 'px',
        capsule: on ? (isMac ? macCapsule : t.rowHov) : 'transparent',
        capsuleEdge: on && isMac ? macCapsuleEdge : 'none',
        ring: on ? t.accent : 'transparent',
        thumbShadow: isMac ? macIdle : (on ? '0 2px 9px rgba(0,0,0,0.4)' : macIdle),
        onClick: () => onSelect && onSelect(i),
        onToggle: (e) => { e.stopPropagation(); onToggle && onToggle(i); },
      });
    });

    // The sidebar itself is a glass layer on macOS 26: translucent, blurred,
    // with a hairline trailing edge and an inner top highlight.
    const panel = isMac
      ? {
          panelBg: t.dark ? 'linear-gradient(rgba(44,44,50,0.56), rgba(32,32,38,0.48))' : 'linear-gradient(rgba(252,251,249,0.64), rgba(244,243,241,0.54))',
          panelBlur: 'blur(34px) saturate(190%)',
          panelEdge: t.dark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.10)',
          panelInner: t.dark
            ? 'inset -1px 0 0 rgba(255,255,255,0.05)'
            : 'inset -1px 0 0 rgba(255,255,255,0.7)',
        }
      : { panelBg: t.panel, panelBlur: 'none', panelEdge: t.border, panelInner: 'none' };

    return Object.assign({ theme: t, isMac, isOther: !isMac, rows, thumbW: isMac ? 150 : 136, onToggleSidebar: this.props.onToggleSidebar }, panel);
  }
}
</script>
</body>
</html>
