<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: {{ w }}; height: {{ h }}; flex-shrink: 0; position: relative; border-radius: {{ radius }}; overflow: hidden; box-shadow: {{ shadow }}; background: linear-gradient(140deg, #2a2452 0%, #171930 55%, #101223 100%);">
  <div style="width: 944px; height: 531px; position: absolute; left: 0; top: 0; transform-origin: top left; transform: {{ tf }};">

    <sc-if value="{{ showGuides }}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 0; border-left: {{ hair }} dashed #f5c518; opacity: 0.9; z-index: 5;"></div>
      <div style="position: absolute; left: 50%; top: {{ chipTop }}; transform: translateX(-50%); background: #f5c518; color: #17181c; font-size: {{ chipFont }}; font-weight: 700; padding: {{ chipPad }}; border-radius: {{ chipRadius }}; white-space: nowrap; font-family: 'IBM Plex Mono', monospace; z-index: 5;">center x</div>
    </sc-if>

    <div style="position: absolute; left: 72px; top: 64px; width: 800px; padding: 10px 14px; box-sizing: content-box; border: {{ selBorder }};">
      <div style="font-size: 46px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px; font-family: 'Ubuntu', sans-serif;">Lorem ipsum dolor</div>
      <div style="font-size: 19px; color: #a9a0d8; margin-top: 6px; font-family: 'Ubuntu', sans-serif;">Consectetur adipiscing elit, sed do eiusmod tempor</div>
      <sc-if value="{{ interactive }}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; left: {{ hOff }}; top: {{ hOff }}; width: {{ hSize }}; height: {{ hSize }}; background: #fff; border: {{ hBorder }} solid #7F52FF; border-radius: {{ hRadius }};"></div>
        <div style="position: absolute; left: 50%; top: {{ hOff }}; margin-left: {{ hHalf }}; width: {{ hSize }}; height: {{ hSize }}; background: #fff; border: {{ hBorder }} solid #7F52FF; border-radius: {{ hRadius }};"></div>
        <div style="position: absolute; right: {{ hOff }}; top: {{ hOff }}; width: {{ hSize }}; height: {{ hSize }}; background: #fff; border: {{ hBorder }} solid #7F52FF; border-radius: {{ hRadius }};"></div>
        <div style="position: absolute; left: {{ hOff }}; top: 50%; margin-top: {{ hHalf }}; width: {{ hSize }}; height: {{ hSize }}; background: #fff; border: {{ hBorder }} solid #7F52FF; border-radius: {{ hRadius }};"></div>
        <div style="position: absolute; right: {{ hOff }}; top: 50%; margin-top: {{ hHalf }}; width: {{ hSize }}; height: {{ hSize }}; background: #fff; border: {{ hBorder }} solid #7F52FF; border-radius: {{ hRadius }};"></div>
        <div style="position: absolute; left: {{ hOff }}; bottom: {{ hOff }}; width: {{ hSize }}; height: {{ hSize }}; background: #fff; border: {{ hBorder }} solid #7F52FF; border-radius: {{ hRadius }};"></div>
        <div style="position: absolute; left: 50%; bottom: {{ hOff }}; margin-left: {{ hHalf }}; width: {{ hSize }}; height: {{ hSize }}; background: #fff; border: {{ hBorder }} solid #7F52FF; border-radius: {{ hRadius }};"></div>
        <div style="position: absolute; right: {{ hOff }}; bottom: {{ hOff }}; width: {{ hSize }}; height: {{ hSize }}; background: #fff; border: {{ hBorder }} solid #7F52FF; border-radius: {{ hRadius }};"></div>
      </sc-if>
      <div style="position: absolute; left: 0; top: {{ badgeTop }}; display: {{ badgeDisplay }}; align-items: center; gap: {{ badgeGap }}; white-space: nowrap;">
        <div style="width: {{ badgeSize }}; height: {{ badgeSize }}; border-radius: 50%; background: #7F52FF; color: #fff; font-size: {{ badgeFont }}; font-weight: 700; display: flex; align-items: center; justify-content: center;">1</div>
        <div style="font-size: {{ badgeFont }}; color: #a98fff;">Fade Up · 0.4s</div>
      </div>
    </div>

    <div style="position: absolute; left: 72px; top: 250px; display: flex; align-items: center; gap: 14px; font-family: 'Ubuntu', sans-serif;">
      <div style="width: 150px; height: 76px; border-radius: 10px; background: rgba(127,82,255,0.22); border: 1.5px solid rgba(169,143,255,0.7); display: flex; align-items: center; justify-content: center; color: #d9cfff; font-size: 15px; font-weight: 600;">Lorem</div>
      <div style="color: #6f66a8; font-size: 18px;">→</div>
      <div style="width: 150px; height: 76px; border-radius: 10px; background: rgba(127,82,255,0.22); border: 1.5px solid rgba(169,143,255,0.7); display: flex; align-items: center; justify-content: center; color: #d9cfff; font-size: 15px; font-weight: 600;">Ipsum</div>
      <div style="color: #6f66a8; font-size: 18px;">→</div>
      <div style="position: relative; width: 150px; height: 76px; border-radius: 10px; background: rgba(245,197,24,0.14); border: 1.5px solid rgba(245,197,24,0.6); display: flex; align-items: center; justify-content: center; color: #ffe28a; font-size: 15px; font-weight: 600;">Dolor
        <div style="position: absolute; left: 0; top: {{ badgeTop }}; display: {{ badgeDisplay }}; align-items: center;">
          <div style="width: {{ badgeSize }}; height: {{ badgeSize }}; border-radius: 50%; background: #7F52FF; color: #fff; font-size: {{ badgeFont }}; font-weight: 700; display: flex; align-items: center; justify-content: center;">2</div>
        </div>
      </div>
      <div style="color: #6f66a8; font-size: 18px;">→</div>
      <div style="width: 150px; height: 76px; border-radius: 10px; background: rgba(127,82,255,0.22); border: 1.5px solid rgba(169,143,255,0.7); display: flex; align-items: center; justify-content: center; color: #d9cfff; font-size: 15px; font-weight: 600;">Amet</div>
    </div>

    <div style="position: absolute; left: 72px; top: 372px; width: 380px; height: 110px; box-sizing: border-box; border-radius: 10px; border: 1.5px dashed rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; gap: 10px; color: rgba(255,255,255,0.45); font-size: 13px; font-family: 'Ubuntu', sans-serif;">
      <svg width="18" height="18" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="0.7" y="0.7" width="12.6" height="12.6" rx="1.5"></rect><circle cx="4.5" cy="4.5" r="1.4"></circle><path d="M1 10.5 L5 7 L8 9.5 L10.5 7.5 L13 9.5"></path></svg>
      Drop image here
    </div>

    <div style="position: absolute; right: 72px; top: 372px; width: 400px; font-size: 15px; line-height: 1.55; color: #b8b3d6; font-family: 'Ubuntu', sans-serif;">Lorem ipsum dolor sit amet, <a href="#">consectetur</a> adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 944, &quot;height&quot;: 531}, &quot;width&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 944, &quot;min&quot;: 60, &quot;max&quot;: 1920, &quot;unit&quot;: &quot;px&quot;, &quot;tsType&quot;: &quot;number&quot;}, &quot;interactive&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;showGuides&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;showBadges&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;radius&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;4px&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;shadow&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    // Authored once at 944x531; every consumer just asks for a width and gets a
    // real render of the slide scaled to it — canvas, navigator thumbnail, or
    // anything later (light table, presenter view).
    const width = Number(this.props.width ?? 944);
    const scale = width / 944;
    const interactive = this.props.interactive ?? false;

    // Editing affordances are UI, not document content, so they must hold a
    // constant SCREEN size at every zoom (as in Keynote). They live inside the
    // scaled board, so each authored length is pre-divided by the scale factor:
    // board length x/scale, multiplied back by scale on paint, lands at x px.
    const px = (n) => (n / scale).toFixed(3) + 'px';

    return {
      w: Math.round(width) + 'px',
      h: Math.round(width * 531 / 944) + 'px',
      tf: 'scale(' + scale.toFixed(5) + ')',
      radius: this.props.radius ?? '4px',
      shadow: this.props.shadow ?? 'none',
      interactive,
      selBorder: interactive ? px(1.5) + ' solid #7F52FF' : px(1.5) + ' solid transparent',
      showGuides: (this.props.showGuides ?? false) && interactive,
      badgeDisplay: (this.props.showBadges ?? false) && interactive ? 'flex' : 'none',
      hSize: px(9),
      hOff: px(-5),
      hHalf: px(-4.5),
      hBorder: px(1.5),
      hRadius: px(2),
      hair: px(1),
      chipTop: px(7),
      chipFont: px(10),
      chipPad: px(1) + ' ' + px(6),
      chipRadius: px(3),
      badgeTop: px(-26),
      badgeSize: px(18),
      badgeFont: px(11),
      badgeGap: px(5),
    };
  }
}
</script>
</body>
</html>
