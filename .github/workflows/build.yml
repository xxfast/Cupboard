# Mirrors the local verify battery (CLAUDE.md Commands): per-target tasks only,
# there is deliberately no aggregate `./gradlew build` (broken composite-build
# interaction between the CuP fork's JS tooling and the emoji-kt included build).
name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-and-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests + web targets + desktop shell
        run: ./gradlew :cupboard:jvmTest :cupboard:ui:jvmTest :cupboard:ui:wasmJsMainClasses :cupboard:ui:jsMainClasses :desktopApp:compileKotlin :cupboard:compileKotlinMingwX64 :winuiApp:linkDebugSharedMingwX64

  macos-app:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Build Cupboard.app (runs Gradle via the Xcode script phase)
        run: >
          xcodebuild -project macosApp/Cupboard.xcodeproj -scheme Cupboard
          -configuration Debug -derivedDataPath macosApp/build/DerivedData build
      - name: Smoke test
        # Launch from outside the repo: the bundle must not rely on cwd-relative
        # resource fallbacks. If Metal proves flaky on CI VMs, degrade this step
        # to `codesign --verify` + a binary-exists check.
        run: |
          APP="$PWD/macosApp/build/DerivedData/Build/Products/Debug/Cupboard.app"
          codesign --verify --deep --strict "$APP"
          cd /tmp
          "$APP/Contents/MacOS/Cupboard" &
          SMOKE_PID=$!
          sleep 5
          if ! kill -0 "$SMOKE_PID" 2>/dev/null; then
            echo "Smoke test FAILED: app exited within 5 seconds" >&2
            exit 1
          fi
          kill "$SMOKE_PID"

  # Provisional: the C# half has never been compiled anywhere, so this job is
  # allowed to fail rather than block. Flip continue-on-error off once it has
  # been proven green at least once.
  windows-app:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Pack the Kotlin core as Cupboard.Kotlin
        # Release shared lib + the NuGet package the C# projects restore from
        # winuiApp/build/nuget (wired up in winuiApp/Directory.Build.props).
        # bash so `./gradlew` works: the default shell here is pwsh.
        shell: bash
        run: ./gradlew :winuiApp:linkReleaseSharedMingwX64 :winuiApp:packNuget
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the WinUI shell
        # The package is already packed, so skip the pack-before-restore hook
        # in winuiApp/Directory.Build.targets and reuse what Gradle produced.
        run: dotnet build winuiApp/WinUiApp/WinUiApp.csproj -c Release -r win-x64 -p:SkipCupboardKotlinNuGetPack=true
